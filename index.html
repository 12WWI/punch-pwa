<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>打卡</title>
<meta name="theme-color" content="#16191C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="打卡">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen app. Home = giant punch button (orange = 上班, blue = 下班); wizards show one question per screen and auto-advance. Look matches 器材調度板: road-case greys + gaffer-tape label. */
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --surface2:#F3F5F7; --ink:#15181B; --muted:#5F6770; --line:#D9DDE2;
  --in:#C9701E; --in-soft:#F6E3CF; --out:#2C6AAE; --out-soft:#DCE7F4; --on:#FFFFFF;
  --ok:#2E8457; --ok-soft:#DAEFE2; --bad:#C23B2A;
  --tape:#F2EDE0; --tape-ink:#1C1A16; --tape-edge:#DCD4BF;
  --glass:rgba(246,247,249,.9); --shadow:0 1px 2px rgba(20,24,28,.06),0 8px 24px rgba(20,24,28,.08);
  --f-num:"Barlow Condensed",system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F1113; --surface:#1A1D20; --surface2:#23272B; --ink:#ECEEF0; --muted:#9AA2AB; --line:#2D3237;
  --in:#E8913E; --in-soft:#3A2814; --out:#6EA8E6; --out-soft:#152638; --on:#0F1113;
  --ok:#55B983; --ok-soft:#163124; --bad:#F06A57;
  --glass:rgba(22,24,27,.9); --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--in);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{min-height:100%;display:flex;flex-direction:column;padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
/* 頂端狀態列底下放一條實心底色：捲動的內容藏在它後面，不會被系統模糊 */
.topshade{position:fixed;top:0;left:0;right:0;height:calc(env(safe-area-inset-top,0px) + 6px);background:var(--bg);z-index:6;pointer-events:none}
.screen{flex:1;display:flex;flex-direction:column;padding:12px max(18px,env(safe-area-inset-left,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));max-width:560px;width:100%;margin:0 auto;gap:16px}
.screen.full{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.fade{animation:fade .22s ease-out}
@keyframes fade{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.fade.back{animation-name:fadeb}
@keyframes fadeb{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

/* home */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top h1{margin:0;font-size:15px;font-weight:500;color:var(--muted)}
.top .date{font-family:var(--f-num);font-size:30px;font-weight:700;line-height:1.1}
.clock{font-family:var(--f-num);font-size:20px;color:var(--muted);text-align:right}
.tape{align-self:flex-start;max-width:100%;background:var(--tape);color:var(--tape-ink);border:1px solid var(--tape-edge);padding:2px 12px;font-weight:700;font-size:14px;letter-spacing:.04em;transform:rotate(-1.2deg);clip-path:polygon(2% 0,98% 4%,100% 50%,98% 100%,1% 96%,0 50%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:300px}
.punch{width:min(72vw,280px);aspect-ratio:1;border-radius:50%;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--on);font-weight:700;font-size:22px;box-shadow:0 14px 40px rgba(0,0,0,.22),inset 0 -6px 0 rgba(0,0,0,.12);transition:transform .1s}
.punch:active{transform:scale(.96)}
.punch.in{background:var(--in)}
.punch.out{background:var(--out)}
.punch b{font-family:var(--f-num);font-size:62px;line-height:1;letter-spacing:.02em}
.punch small{font-size:14px;font-weight:500;opacity:.85}
.status{text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}
.status .big{font-size:18px;font-weight:700}
.status .sub{font-size:14px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.crow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;min-height:52px}
.crow:last-child{border-bottom:0}
button.crow:active{background:var(--surface2)}
.crow .k{color:var(--muted);font-size:14px;width:76px;flex:none}
.crow .v{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.crow .v.none{color:var(--muted);font-weight:400}
.chev{width:18px;height:18px;color:var(--muted)}
.linkbtn{border:0;background:transparent;color:var(--in);font-weight:600;font-size:15px;padding:8px;align-self:center}
.sech{font-family:var(--f-num);font-size:14px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:4px 4px -6px}

/* wizard */
.wtop{display:flex;align-items:center;gap:8px;min-height:44px}
.back{border:0;background:transparent;color:var(--in);display:flex;align-items:center;font-size:16px;padding:6px 6px 6px 0}
.dots{flex:1;display:flex;gap:8px;align-items:center;justify-content:center}
.dots i{width:22px;height:4px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--in)}
.boba{font-size:30px;line-height:1;opacity:.25;filter:grayscale(1)}
.boba.on{opacity:1;filter:none}
.wflow-out .dots i.on{background:var(--out)}
.skip{border:0;background:transparent;color:var(--muted);font-size:15px;padding:6px 0 6px 6px;min-width:44px;text-align:right}
.q{margin:18px 0 0;font-size:28px;font-weight:700;line-height:1.3;text-wrap:balance}
.qhint{margin:-6px 0 0;color:var(--muted);font-size:14.5px}
.field{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px 18px;font-size:20px;outline:none}
.field:focus{border-color:var(--in)}
.wflow-out .field:focus{border-color:var(--out)}
.field.bigtime{font-family:var(--f-num);font-size:56px;font-weight:700;text-align:center;letter-spacing:.04em;padding:10px}
.err{color:var(--bad);font-size:14.5px;margin:-4px 0 0;min-height:1.2em}
.chips{display:flex;flex-direction:column;gap:10px}
.chip{display:flex;align-items:center;gap:14px;width:100%;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;text-align:left;font-size:17px;font-weight:600;min-height:60px}
.chip:active{transform:scale(.99)}
.chip .lt{width:34px;height:34px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-family:var(--f-num);font-size:20px;font-weight:700;color:var(--muted);flex:none}
.chip small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
.chip.on{border-color:var(--in);background:var(--in-soft)}
.chip.on .lt{background:var(--in);color:var(--on)}
.wflow-out .chip.on{border-color:var(--out);background:var(--out-soft)}
.wflow-out .chip.on .lt{background:var(--out)}
.quick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:500}
.pill:active{background:var(--surface2)}
.pill.on{border-color:var(--in);background:var(--in-soft);color:var(--in);font-weight:700}
.inline3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px}
.inline3 .cta{padding:12px 6px;font-size:15px}
.spacer{flex:1}
.cta{width:100%;border:0;border-radius:16px;padding:17px;font-size:18px;font-weight:700;color:var(--on);background:var(--in)}
.wflow-out .cta,.cta.blue{background:var(--out)}
.cta.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.cta:disabled{opacity:.4}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.inline{display:flex;gap:8px}
.inline .field{flex:1;min-width:0;font-size:17px;padding:13px 14px}
.inline button{flex:none;border:0;border-radius:14px;background:var(--in);color:var(--on);font-weight:700;padding:0 18px}
.breakrow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.breakrow .field{font-family:var(--f-num);font-size:34px;font-weight:700;text-align:center;padding:10px 6px}
.breakrow span{color:var(--muted)}
.review .crow .v{font-size:16.5px}
.warn{background:var(--in-soft);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.55}

/* lists */
.lt1{margin:6px 0 0;font-family:var(--f-num);font-size:36px;font-weight:700;line-height:1}
.ev{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .d{width:54px;flex:none;font-family:var(--f-num);font-size:20px;font-weight:700;line-height:1.1}
.ev .d small{display:block;font-family:var(--f-body);font-size:11.5px;font-weight:400;color:var(--muted)}
.ev .n{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.ev .n small{display:block;font-size:13px;color:var(--muted);font-weight:400}
.ev .x{border:0;background:transparent;color:var(--muted);font-size:14px;padding:6px}
.ev .x.armed{color:var(--bad);font-weight:700}
.empty{border:1px dashed var(--line);border-radius:16px;padding:22px;color:var(--muted);text-align:center;font-size:14.5px;background:var(--surface)}
.total{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:baseline}
.total b{font-family:var(--f-num);font-size:34px;line-height:1}
.total span{color:var(--muted);font-size:14px}
.addbox{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.addbox .row{display:flex;gap:8px;align-items:center}
.addbox label{font-size:13px;color:var(--muted);width:36px;flex:none}
.addbox input{flex:1;min-width:0;width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:11px;padding:11px 12px;font-size:16px}
.addbox input[type=date]{-webkit-appearance:none;appearance:none;min-height:46px;text-align:left;display:block}
.addbox input[type=date]::-webkit-date-and-time-value{text-align:left}
.addbox .note{font-size:12.5px;color:var(--muted);margin:-4px 0 0 44px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
nav.tabs button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 9px;font-size:11.5px;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--in);font-weight:700}
.imp{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;counter-reset:n}
.imp li{display:flex;gap:10px;font-size:15px;line-height:1.45;counter-increment:n}
.imp li::before{content:counter(n);flex:none;width:24px;height:24px;border-radius:50%;background:var(--in-soft);color:var(--in);font-family:var(--f-num);font-weight:700;display:grid;place-items:center}
textarea.field{font-size:15px;line-height:1.5;padding:12px 14px;resize:vertical}
.promptbox{white-space:pre-wrap;font-size:13px;background:var(--surface2);border-radius:12px;padding:12px;-webkit-user-select:text;user-select:text}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;max-width:calc(100% - 40px);text-align:center}
</style>
</head>
<body>
<div class="topshade" aria-hidden="true"></div>
<div id="app"></div>
<nav class="tabs" id="tabs" hidden></nav>
<div class="toast" id="toast" role="status" hidden></div>
<script>
/* ===== 表單設定 =====
   表單資訊不寫在程式裡：第一次使用時貼上設定碼，只存在這支手機。 */
const ENTRY_KEYS=["email","event","name","startDate","startTime","breakStart","breakEnd","endDate","endTime","transport"];
const REQUIRED_KEYS=ENTRY_KEYS;
let FORM_ID="",ENTRY={};
function useCode(raw){try{const o=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(String(raw).replace(/\s/g,"")),c=>c.charCodeAt(0))));if(typeof o.f!=="string"||!o.f||!Array.isArray(o.e)||o.e.length<REQUIRED_KEYS.length||!o.e.every(x=>typeof x==="string"&&x))return false;FORM_ID=o.f;ENTRY=Object.fromEntries(ENTRY_KEYS.map((k,i)=>[k,o.e[i]||""]));return true}catch(_){return false}}
try{useCode(localStorage.getItem("punch.code")||"")}catch(_){}
/* 設定連結：網址 # 後面帶設定碼（# 後面的字不會傳到網站，只在手機裡讀） */
const codeFrom=raw=>{const s=String(raw||"").trim();const m=s.match(/[#&]c=([^&\s]+)/);try{return m?decodeURIComponent(m[1]):s}catch(_){return s}};
function saveCode(raw){const c=codeFrom(raw).replace(/\s/g,"");if(!useCode(c))return false;try{localStorage.setItem("punch.code",c)}catch(_){}return true}
const IS_IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const IS_APP=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
let LINK_MSG="";
try{if(/[#&]c=/.test(location.hash)){LINK_MSG=saveCode(location.hash)?"ok":"bad";window.history.replaceState(null,"",location.pathname)}}catch(_){}
const shareLink=()=>location.origin+location.pathname+"?openExternalBrowser=1#c="+encodeURIComponent(localStorage.getItem("punch.code")||"");
const TRANSPORT=["公司集合","自行前往（開車）來回","自行前往（機車）來回","大眾運輸"];
const TRANSPORT_LABEL={"公司集合":["公司集合","一起從公司出發"],"自行前往（開車）來回":["自己開車","來回"],"自行前往（機車）來回":["自己騎車","來回"],"大眾運輸":["大眾運輸","捷運、公車、高鐵"]};

/* ===== storage ===== */
const DB={get(k,d){try{const v=localStorage.getItem("punch."+k);return v==null?d:JSON.parse(v)}catch(_){return d}},set(k,v){try{localStorage.setItem("punch."+k,JSON.stringify(v))}catch(_){}}};
let profile=DB.get("profile",{email:"",name:"",transport:""});
let cal=DB.get("cal",[]);            // [{id,date,end,name,time,src}]
let shift=DB.get("shift",null);      // 上班中的紀錄
let history=DB.get("history",[]);    // 送出過的紀錄
const save=()=>{DB.set("profile",profile);DB.set("cal",cal);DB.set("shift",shift);DB.set("history",history)};
/* 已經過去的行程不留 */
{const t=(d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`)(new Date());const n=cal.length;cal=cal.filter(e=>(e.end||e.date)>=t);if(cal.length!==n)DB.set("cal",cal)}

/* ===== helpers ===== */
const $=id=>document.getElementById(id);
const WD=["日","一","二","三","四","五","六"];
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const mmdd=s=>s?s.slice(5,7)+s.slice(8,10):"";
const md=s=>s?`${+s.slice(5,7)}/${+s.slice(8,10)}`:"";
const nice=s=>{if(!s)return"";const d=parseYmd(s);return`${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`};
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
/* 打卡時間：往前取到 5 分鐘（11:07 → 11:05，11:13 → 11:10） */
function floor5(d){return{date:ymd(d),time:`${pad(d.getHours())}:${pad(Math.floor(d.getMinutes()/5)*5)}`}}
function normTime(raw){const s=String(raw||"").replace(/[^\d]/g,"");if(s.length<3)return null;const h=+s.slice(0,s.length-2),m=+s.slice(-2);if(h>23||m>59)return null;return`${pad(h)}:${pad(m)}`}
function mmddToYmd(raw,ref){const s=String(raw||"").replace(/[^\d]/g,"");if(s.length!==4)return null;const m=+s.slice(0,2),d=+s.slice(2);if(m<1||m>12||d<1||d>31)return null;const r=ref?parseYmd(ref):new Date();let y=r.getFullYear();let c=new Date(y,m-1,d);if(c.getMonth()!==m-1)return null;if(c-r>60*864e5)c=new Date(y-1,m-1,d);if(r-c>300*864e5)c=new Date(y+1,m-1,d);return ymd(c)}
function minutesOf(date,time){const[h,m]=time.split(":").map(Number);return parseYmd(date).getTime()/6e4+h*60+m}
function shiftHours(s){if(!s.startDate||!s.startTime||!s.endDate||!s.endTime)return null;let w=minutesOf(s.endDate,s.endTime)-minutesOf(s.startDate,s.startTime);if(s.breakStart&&s.breakEnd){let b=minutesOf("2000-01-01",s.breakEnd)-minutesOf("2000-01-01",s.breakStart);if(b<0)b+=1440;w-=b}return w/60}
const fmtH=h=>h==null?"":(Math.round(h*100)/100)+" 小時";
const addDays=(ymdStr,n)=>{const x=parseYmd(ymdStr);return ymd(new Date(x.getFullYear(),x.getMonth(),x.getDate()+n))};
/* 上班時間改了以後，日期挑「不晚於下班（或現在）」最近的那一天：半夜後改成 0600 就是前一天的 06:00 */
function fitStartDate(d,time){const ref=d.endDate&&d.endTime?minutesOf(d.endDate,d.endTime):Date.now()/6e4;const base=d.startDate||today();for(const n of[1,0,-1]){const c=addDays(base,n);if(minutesOf(c,time)<=ref)return c}return addDays(base,-1)}
/* 休息要在上下班之間（可以跨午夜） */
function breakOk(d){if(!d.breakStart||!d.breakEnd||!d.endTime)return true;const s0=minutesOf(d.startDate,d.startTime),e0=minutesOf(d.endDate,d.endTime);let b1=minutesOf(d.startDate,d.breakStart);if(b1<s0)b1+=1440;let b2=minutesOf(d.startDate,d.breakEnd);while(b2<=b1)b2+=1440;return b2<=e0}
/* 可能按錯（不擋，送出前問一次）：太長、太久以前、跟已經打過的卡重疊 */
function timeWarnings(d){
  const out=[];if(!d.endTime)return out;
  const h=shiftHours(d);if(h!=null&&h>18)out.push(`這次共 ${fmtH(h)}，比平常長很多`);
  if(minutesOf(d.startDate,d.startTime)<Date.now()/6e4-7*1440)out.push(`上班日期是 ${nice(d.startDate)}，已經是一個禮拜以前`);
  const s0=minutesOf(d.startDate,d.startTime),e0=minutesOf(d.endDate,d.endTime);
  const dup=history.find(x=>x.startDate&&x.startTime&&x.endDate&&x.endTime&&minutesOf(x.startDate,x.startTime)<e0&&s0<minutesOf(x.endDate,x.endTime));

/* 這天已經確認送出的活動就不再列出（跨好幾天的活動，隔天會再出現）。還沒確認送出的不算。 */
const toArr=t=>Array.isArray(t)?t:(t?[t]:[]);
const evNames=h=>h.events?h.events.map(e=>e.name):String(h.event||"").split("、").filter(Boolean);
const punched=(name,d)=>history.some(h=>h.startDate===d&&h.status!=="pending"&&evNames(h).includes(name));
function eventsOn(d){return cal.filter(e=>e.date<=d&&d<=(e.end||e.date)&&!punched(e.name,d)).sort((a,b)=>(a.time||"").localeCompare(b.time||"")||a.name.localeCompare(b.name,"zh-Hant"))}
/* 凌晨 6 點前，昨天的場次也一起列（跨夜場） */
function dayEvents(ref){const t=today();ref=ref||t;const list=eventsOn(ref).map(e=>({...e,tag:""}));if(ref===t&&new Date().getHours()<6){const y=ymd(new Date(Date.now()-864e5));for(const e of eventsOn(y))if(!list.some(x=>x.name===e.name))list.push({...e,tag:"昨天"})}return list}

function manualParse(d){const r=d.raw,sd=mmddToYmd(r.sd,today()),st=normTime(r.st),et=normTime(r.et);let ed=null;if(sd&&st&&et)ed=et>=st?sd:ymd(new Date(parseYmd(sd).getTime()+864e5));return{sd,st,et,ed,b1:normTime(r.b1),b2:normTime(r.b2)}}
function manualSum(d){const p=manualParse(d);if(!p.sd||!p.st||!p.et)return"填好日期和上下班時間，這裡會算時數";const h=shiftHours({startDate:p.sd,startTime:p.st,endDate:p.ed,endTime:p.et,breakStart:p.b1&&p.b2?p.b1:"",breakEnd:p.b1&&p.b2?p.b2:""});return`${nice(p.sd)} ${p.st} – ${p.ed!==p.sd?"隔天 ":""}${p.et} · 共 ${fmtH(h)}`}
function manualSubmit(){
  const d=S.wiz.data,r=d.raw,p=manualParse(d),names=r.ev.split(/[、,，]/).map(x=>x.trim()).filter(Boolean);
  if(!p.sd)return setErr("日期格式是月日 4 碼，例如 1122。");
  if(!names.length)return setErr("請輸入活動名稱。");
  if(!p.st||!p.et)return setErr("請填上班和下班時間，例如 0830 和 1800。");
  if((r.b1.trim()||r.b2.trim())&&!(p.b1&&p.b2))return setErr("休息要填開始和結束，沒有就兩格都空白。");
  if(!d.trs.length)return setErr("請選交通方式。");
  if(p.b1&&p.b2&&!breakOk({startDate:p.sd,startTime:p.st,endDate:p.ed,endTime:p.et,breakStart:p.b1,breakEnd:p.b2}))return setErr("休息時間要在上班和下班之間。");
  Object.assign(d,{events:names.map(n=>({name:n,transport:""})),startDate:p.sd,startTime:p.st,endDate:p.ed,endTime:p.et,breakStart:p.b1&&p.b2?p.b1:"",breakEnd:p.b1&&p.b2?p.b2:""});
  submitForm();
}
function timeStep(q,val,key){

    <input class="field bigtime" id="f" inputmode="numeric" maxlength="5" placeholder="00:00" value="${val||""}" data-time="${key}">
    <div class="quick"><button type="button" class="pill" data-adj="-5" data-k="${key}">−5 分</button><button type="button" class="pill" data-setnow="${key}">現在 ${n}</button><button type="button" class="pill" data-adj="5" data-k="${key}">+5 分</button></div>
    <p class="err" id="err"></p><div class="spacer"></div><button type="button" class="cta" data-ok="${key}">${S.wiz&&!S.wiz.editOnly&&S.wiz.i<S.wiz.steps.length-1?"下一步":"確定"}</button>`;
}
function setErr(m){const e=$("err");if(e)e.textContent=m||""}
const nextDay=s=>ymd(new Date(parseYmd(s).getTime()+864e5));
/* 新加的地點先帶上一個地點的交通 */
function fillLegs(d){d.events.forEach((e,i)=>{if(!e.transport){e.transport=i?d.events[i-1].transport:(profile.transport||"");e.auto=true}})}
function addEvent(d,name){name=String(name||"").trim();if(!name||d.events.some(e=>e.name===name))return false;d.events.push({name,transport:"",auto:true});return true}
function commit(key){
  const d=S.wiz.data,f=$("f");
  if(key==="email"){const v=f.value.trim();if(!/^\S+@\S+\.\S+$/.test(v))return setErr("請輸入正確的 Email。");d.email=v;return next()}

}
const colonize=v=>{const s=v.replace(/[^\d]/g,"").slice(0,4);return s.length>2?s.slice(0,2)+":"+s.slice(2):s};

  const f=$("f");

  if(f)f.onkeydown=e=>{if(e.key!=="Enter")return;e.preventDefault();if(stepKey()==="events"){document.querySelector("[data-addev]").click();return}const ok=document.querySelector("[data-ok]");ok&&ok.click()};

    for(const[id,k]of Object.entries(map)){const el=$(id);if(!el)continue;el.oninput=()=>{if(id!=="mev"&&id!=="msd")el.value=colonize(el.value);if(id==="msd")el.value=el.value.replace(/[^\d]/g,"").slice(0,4);d.raw[k]=el.value;$("msum").textContent=manualSum(d);setErr("");const i=order.indexOf(id);if(i>=0&&i<order.length-1&&el.value.replace(/[^\d]/g,"").length===4)$(order[i+1]).focus()};if(id==="msd")el.onchange=()=>render()}
  }
}

function calPrompt(){const t=today();return`這是一張工作行事曆的截圖。請整理成下面的格式，每個活動一行，全部放在一個程式碼區塊裡，不要加其他說明：

月/日 活動名稱
月/日-月/日 活動名稱
月/日 活動名稱 13:00

規則：
- 今天是 ${t.slice(0,4)} 年 ${md(t)}。${md(t)} 以前就結束的活動不要列。
- 活動名稱照截圖上的字，一字不改，不要加 emoji 或符號。括號和括號裡的字不用寫；名稱被截斷的，只寫看得到的部分。
- 跨好幾天的長條寫起訖日期；長條換行接到下一週的，合併成同一行。
- 截圖上有寫時間的，放在那一行最後面。
- 同一天有好幾個活動，就分好幾行。`}
function futureYmd(m,d,ref){if(m<1||m>12||d<1||d>31)return null;const r=parseYmd(ref);let c=new Date(r.getFullYear(),m-1,d);if(c.getMonth()!==m-1)return null;if(r-c>120*864e5)c=new Date(r.getFullYear()+1,m-1,d);return ymd(c)}
/* 括號裡的字、被截斷的尾巴都不要：「週年晚會（台北）」→「週年晚會」、「戶外音樂節（場…」→「戶外音樂節」 */
function cleanName(n){return String(n).replace(/[（(][^）)]*[）)]?/g,"").replace(/(\.{3}|…)+/g,"").replace(/[\u2600-\u27BF\u{1F000}-\u{1FAFF}\uFE0F]/gu,"").replace(/\s+/g," ").replace(/[\s\-－]+$/,"").trim()}
function parseCal(txt){
  const t=today(),out=[],bad=[];
  for(const raw of String(txt||"").split(/\r?\n/)){
    let s=raw.trim();if(!s||/^`{3}/.test(s))continue;
    s=s.replace(/^[-*•·>]+\s*/,"").replace(/／/g,"/").replace(/：/g,":").replace(/[~～–—至到]/g,"-");
    const m=s.match(/^(\d{1,2})\/(\d{1,2})(?:\s*-\s*(?:(\d{1,2})\/)?(\d{1,2}))?\s+(.+)$/);
    if(!m){bad.push(raw.trim());continue}
    let name=m[5].trim(),time="";const tm=name.match(/\s+(\d{1,2}:\d{2})$/);if(tm){time=normTime(tm[1])||"";name=name.slice(0,tm.index).trim()}
    name=cleanName(name);
    const date=futureYmd(+m[1],+m[2],t);if(!date||!name){bad.push(raw.trim());continue}
    let end="";if(m[4]){end=futureYmd(m[3]?+m[3]:+m[1],+m[4],date);if(!end||end<date){bad.push(raw.trim());continue}if(end===date)end=""}
    if((end||date)<t)continue;
    if(out.some(x=>x.name===name&&x.date===date))continue;
    out.push({name,date,end,time});
  }
  out.sort((a,b)=>a.date.localeCompare(b.date)||(a.time||"").localeCompare(b.time||""));
  return{out,bad};
}
/* 匯入範圍內，之前匯入的行程換成新的（行程有改就跟著改）；手動加的不動 */
function applyImport(list){
  const lo=list.reduce((a,e)=>e.date<a?e.date:a,"9999-99-99"),hi=list.reduce((a,e)=>(e.end||e.date)>a?(e.end||e.date):a,"");
  cal=cal.filter(e=>!(e.src==="img"&&e.date>=lo&&e.date<=hi));
  let n=0;for(const e of list){if(cal.some(x=>x.name===e.name&&x.date===e.date))continue;cal.push({id:rid(),...e,src:"img"});n++}
  save();return n;
}
function viewImport(){
  const im=S.imp;
  const head=`<div class="screen fade"><div class="wtop"><button type="button" class="back" data-impcancel>${IC.back}${im.step==="preview"?"上一步":"取消"}</button><div class="dots"></div><span class="skip"></span></div>`;
  if(im.step==="preview"){
    const{out,bad}=parseCal(im.text);
    return head+`<h2 class="q">確認行程</h2><p class="qhint">共 ${out.length} 筆。名字有錯可以先匯入，再到行事曆刪掉重加。</p>
      ${out.length?`<div class="card">${out.map(e=>{const d=parseYmd(e.date);return`<div class="ev"><span class="d">${d.getMonth()+1}/${d.getDate()}<small>週${WD[d.getDay()]}</small></span><span class="n">${esc(e.name)}<small>${[e.end?`到 ${nice(e.end)}`:"",e.time].filter(Boolean).join(" · ")}</small></span></div>`}).join("")}</div>`:`<div class="empty">沒有讀到行程。請確認貼上的是 AI 回的那段文字。</div>`}
      ${bad.length?`<div class="warn">這幾行看不懂，不會匯入：<br>${bad.map(esc).join("<br>")}</div>`:""}
      <div class="spacer"></div><button type="button" class="cta" data-impgo>${out.length?`匯入 ${out.length} 筆`:"匯入"}</button></div>`;
  }
  return head+`<h2 class="q">從截圖匯入行程</h2>
    <ol class="imp"><li>按「複製提示詞」。</li><li>打開 Claude 或 ChatGPT App，貼上提示詞，再附上行事曆截圖送出。</li><li>把 AI 回的整段文字複製，回來貼在下面。</li></ol>
    <button type="button" class="cta ghost" data-copyprompt>複製提示詞</button>
    ${im.showPrompt?`<div class="promptbox">${esc(calPrompt())}</div>`:""}
    <textarea class="field" id="impText" rows="8" autocomplete="off" spellcheck="false" placeholder="例如：&#10;11/22 週年晚會&#10;11/23-11/24 戶外音樂節">${esc(im.text||"")}</textarea>
    <p class="qhint" style="margin:0">今天以前的日期會自動略過。同一段日期裡之前匯入的行程，會換成這次的版本。</p>
    <div class="spacer"></div><button type="button" class="cta" data-impcheck>下一步</button></div>`;
}
document.addEventListener("input",e=>{if(e.target.id==="impText"&&S.imp){S.imp.text=e.target.value;saveImp()}});
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.closest("[data-impopen]")){S.imp={step:"paste",text:""};saveImp();render();window.scrollTo(0,0);return}
  if(t.closest("[data-impcancel]")){if(S.imp.step==="preview")S.imp.step="paste";else S.imp=null;saveImp();render();return}
  if(t.closest("[data-copyprompt]")){const p=calPrompt();(navigator.clipboard?navigator.clipboard.writeText(p):Promise.reject()).then(()=>toast("已複製提示詞，去 AI App 貼上")).catch(()=>{S.imp.showPrompt=true;render();toast("請長按下面的文字自己複製")});return}
  if(t.closest("[data-impcheck]")){const v=$("impText").value;if(!v.trim()){toast("先把 AI 回的文字貼上");return}S.imp.text=v;S.imp.step="preview";saveImp();render();window.scrollTo(0,0);return}
  if(t.closest("[data-impgo]")){const{out}=parseCal(S.imp.text);if(!out.length){toast("沒有讀到行程，按「上一步」重新貼上");return}const n=applyImport(out);S.imp=null;saveImp();toast(`已匯入 ${out.length} 筆行程`);render();window.scrollTo(0,0);return}
});

/* ===== 紀錄 ===== */
function viewHist(){
  const now=new Date(),key=S.month||`${now.getFullYear()}-${pad(now.getMonth()+1)}`;
  const months=[...new Set(history.map(h=>h.startDate.slice(0,7)))].sort().reverse();if(!months.includes(key))months.unshift(key);
  const list=history.filter(h=>h.startDate.startsWith(key)).sort((a,b)=>b.startDate.localeCompare(a.startDate)||b.startTime.localeCompare(a.startTime));
  const total=list.reduce((a,h)=>a+(shiftHours(h)||0),0);
  return`<div class="screen fade"><h1 class="lt1">紀錄</h1>
    <div class="quick" style="justify-content:flex-start">${months.slice(0,6).map(m=>`<button type="button" class="pill" data-month="${m}" style="${m===key?"border-color:var(--in);color:var(--in);font-weight:700":""}">${+m.slice(5)} 月</button>`).join("")}</div>
    <div class="total"><span>${+key.slice(5)} 月共 ${list.length} 次</span><b>${fmtH(total)}</b></div>
    ${list.length?`<div class="card">${list.map(h=>`<div class="ev" style="flex-wrap:wrap"><span class="d">${mmdd(h.startDate).replace(/^(\d\d)(\d\d)$/,(_,a,b)=>`${+a}/${+b}`)}<small>週${WD[parseYmd(h.startDate).getDay()]}</small></span><span class="n">${esc(h.event)}<small class="num" style="font-size:15px">${h.startTime} – ${h.endTime}${h.endDate!==h.startDate?"（隔天）":""} · ${fmtH(shiftHours(h))}${h.status==="pending"?` · <span style="color:var(--in)">還沒確認送出</span>`:""}</small></span><button type="button" class="x" data-reopen="${h.id}">${entryReady()?"再開表單":"複製"}</button><button type="button" class="x" data-delhist="${h.id}">刪除</button>
      ${S.copy===h.id?`<div style="flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;padding-top:8px">${[["Email",profile.email],["活動",h.event],["姓名",profile.name],["上班日期",mmdd(h.startDate)],["上班時間",h.startTime],["休息開始",h.breakStart],["休息結束",h.breakEnd],["下班日期",mmdd(h.endDate)],["下班時間",h.endTime],["交通",toArr(h.transport).join("、")],["交通其他",h.trNote]].filter(x=>x[1]).map(([l,v])=>`<button type="button" class="pill" data-copy="${esc(v)}">${l}：${esc(v)}</button>`).join("")}</div>`:""}</div>`).join("")}</div>`:`<div class="empty">這個月還沒有打卡紀錄。</div>`}
    <p class="qhint" style="margin:0">紀錄只存在這支手機上。「再開表單」會重新打開填好的表單，不會重複送出，除非你再按一次提交。</p></div>`;
}
document.addEventListener("click",e=>{const m=e.target.closest("[data-month]");if(m){S.month=m.dataset.month;render()}});

/* ===== 設定 ===== */
function viewSettings(){
  const ready=entryReady();
  return`<div class="screen fade"><h1 class="lt1">設定</h1>
    <div class="card"><button type="button" class="crow" data-setp="name"><span class="k">姓名</span><span class="v">${esc(profile.name)}</span>${IC.chev}</button><button type="button" class="crow" data-setp="email"><span class="k">Email</span><span class="v">${esc(profile.email)}</span>${IC.chev}</button></div>
    <div class="sech">預設交通方式</div>
    <div class="card">${TRANSPORT.map(t=>`<button type="button" class="crow" data-settrans="${esc(t)}"><span class="v">${TRANSPORT_LABEL[t][0]}</span>${profile.transport===t?'<span style="color:var(--in);font-weight:700">✓</span>':""}</button>`).join("")}</div>
    <div class="sech">表單</div>
    <div class="card"><div class="crow"><span class="v">${ready?"表單已設定，送出時會自動填好":"表單還沒設定"}</span><span style="color:${ready?"var(--ok)":"var(--bad)"};font-weight:700">${ready?"✓":"!"}</span></div>${ready?`<button type="button" class="crow" data-sharecode><span class="v">分享設定連結給同事</span>${IC.chev}</button>`:""}<button type="button" class="crow" data-resetcode><span class="v">重新輸入設定碼</span>${IC.chev}</button></div>
    ${ready?'<p class="qhint" style="margin:-6px 0 14px">同事點連結就設定好，不用貼設定碼。連結裡有表單代碼，請私訊傳，不要貼到公開的地方。</p>':""}
    <button type="button" class="cta ghost" data-export>下載備份（行事曆和紀錄）</button>
    <p class="qhint" style="margin:0">資料只存在這支手機的瀏覽器裡。換手機或清除瀏覽資料前，記得先下載備份。</p></div>`;
}

document.addEventListener("click",e=>{
  if(e.target.closest("[data-savecode]")){if(!saveCode($("code").value)){toast("設定碼不正確，請重新貼上");return}toast("設定完成");render();return}
  if(e.target.closest("[data-pastecode]")){(navigator.clipboard&&navigator.clipboard.readText?navigator.clipboard.readText():Promise.reject()).then(v=>{if(!saveCode(v)){toast("剪貼簿裡不是設定連結，請重新複製");return}toast("設定完成");render()}).catch(()=>toast("讀不到剪貼簿，請長按框框貼上"));return}
  if(e.target.closest("[data-copylink]")){(navigator.clipboard?navigator.clipboard.writeText(shareLink()):Promise.reject()).then(()=>toast("已複製設定連結")).catch(()=>toast("複製失敗，請到設定頁再試"));return}
  if(e.target.closest("[data-iosdone]")){S.iosGuide=false;render();return}
  if(e.target.closest("[data-sharecode]")){const url=shareLink();if(navigator.share){navigator.share({title:"打卡",text:"點開就會設定好打卡表單",url}).catch(()=>{});return}(navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast("已複製設定連結，貼給同事")).catch(()=>toast("複製失敗"));return}
  if(e.target.closest("[data-resetcode]")){if(!confirm("要重新輸入設定碼嗎？行事曆和紀錄不會動。"))return;try{localStorage.removeItem("punch.code")}catch(_){}FORM_ID="";ENTRY={};render()}
});

/* ===== clock tick ===== */
setInterval(()=>{if(S.wiz||S.tab!=="home")return;const n=new Date(),c=$("clk"),p=$("pt");if(c)c.textContent=`${pad(n.getHours())}:${pad(n.getMinutes())}`;if(p)p.textContent=floor5(n).time},5000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!S.wiz)render()});

/* 自動更新：每次回到 App 都檢查新版；有新版就重新載入（正在填資料的話，等填完回到首頁再載入） */
let reloadLater=false;
if("serviceWorker"in navigator&&location.protocol!=="file:"){
  const hadCtrl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{document.addEventListener("visibilitychange",()=>{if(!document.hidden)reg.update().catch(()=>{})})}).catch(()=>{});
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!hadCtrl)return;if(S.wiz||S.imp)reloadLater=true;else location.reload()});
}
setInterval(()=>{if(reloadLater&&!S.wiz&&!S.imp)location.reload()},2000);
render();if(LINK_MSG==="ok")toast("設定完成");else if(LINK_MSG==="bad")toast("設定連結不完整，請同事重傳一次");
</script>
